[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
childlogdir=/tmp

[program:display-manager]
command=/usr/bin/python3 /usr/local/bin/display_manager.py serve --run-id platform-display-stack
autostart=true
autorestart=unexpected
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=8
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

