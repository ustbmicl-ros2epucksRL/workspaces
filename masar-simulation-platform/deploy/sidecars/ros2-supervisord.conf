[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:rosbridge]
command=/usr/local/bin/run-ros2-sidecar rosbridge
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=100
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tf2_web_republisher]
command=/usr/local/bin/run-ros2-sidecar tf2_web_republisher
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=100
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web_video_server]
command=/usr/local/bin/run-ros2-sidecar web_video_server
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=100
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
