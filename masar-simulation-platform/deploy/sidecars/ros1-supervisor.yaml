schema_version: 1
distribution: noetic
ports:
  rosbridge: 127.0.0.1:18111
  video: 127.0.0.1:18121
browser_policy:
  publish: false
  call_service: false
  parameters: false
programs:
  rosbridge:
    command: /usr/local/bin/run-ros1-sidecar rosbridge
    required_socket: 127.0.0.1:18111
  tf2_web_republisher:
    command: /usr/local/bin/run-ros1-sidecar tf2_web_republisher
  web_video_server:
    command: /usr/local/bin/run-ros1-sidecar web_video_server
    required_socket: 127.0.0.1:18121
