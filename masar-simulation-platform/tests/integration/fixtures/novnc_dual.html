<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MASAR dual noVNC acceptance</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #07111d; color: #e6f2ff; }
      body { display: grid; grid-template-rows: 48px 1fr; font-family: system-ui, sans-serif; }
      header { display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid #244159; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; padding: 10px; }
      section { display: grid; grid-template-rows: 34px 1fr; min-width: 0; min-height: 0; border: 1px solid #244159; }
      h2 { margin: 0; padding: 7px 10px; color: #88d8ff; font-size: 14px; font-weight: 600; }
      iframe { width: 100%; height: 100%; border: 0; background: #111827; }
    </style>
  </head>
  <body>
    <header>MASAR Task 7 · Gazebo / RViz 独立显示验收</header>
    <main>
      <section id="gazebo-panel">
        <h2>Gazebo · DISPLAY=:101</h2>
        <iframe
          id="gazebo-frame"
          title="Gazebo noVNC"
          src="http://127.0.0.1:18090/display/gazebo/vnc.html?autoconnect=true&amp;resize=scale&amp;path=display/gazebo/websockify"
        ></iframe>
      </section>
      <section id="rviz-panel">
        <h2>RViz · DISPLAY=:102</h2>
        <iframe
          id="rviz-frame"
          title="RViz noVNC"
          src="http://127.0.0.1:18090/display/rviz/vnc.html?autoconnect=true&amp;resize=scale&amp;path=display/rviz/websockify"
        ></iframe>
      </section>
    </main>
  </body>
</html>
