schema_version: 1
scenario_id: control.gazebo.response-controller
module: control
simulator: gazebo
runtime:
  ros1_master_uri: http://127.0.0.1:11311
  ros2_domain_id: 0
display_profile: control
parameters:
  mode:
    type: string
    default: roundflocking
    enum: [roundflocking, roundflocking-checkpoint, roundflocking-heuristic, transport, transport-checkpoint, transport-heuristic]
    description: Existing controller demo task selector.
steps:
  - id: response_controller
    agent: ros1
    command_ref: ros1.response_controller
    depends_on: []
    readiness:
      all:
        - type: ros1_topic
          name: /clock
          message_type: rosgraph_msgs/Clock
        - type: ros1_topic
          name: /tb_0/odom
          message_type: nav_msgs/Odometry
        - type: ros1_topic
          name: /response_group/behavior_mode
          message_type: std_msgs/String
    start_timeout_seconds: 120
    grace_seconds: {sigint: 10, sigterm: 5, sigkill: 5}
stop_order: [response_controller]
data_profile: response_demo
artifact_profile: none
minimum_free_bytes: 2147483648
