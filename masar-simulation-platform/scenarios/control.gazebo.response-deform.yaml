schema_version: 1
scenario_id: control.gazebo.response-deform
module: control
simulator: gazebo
runtime:
  ros1_master_uri: http://127.0.0.1:11311
  ros2_domain_id: 42
display_profile: control
parameters: {}
steps:
  - id: response_demo
    agent: ros1
    command_ref: ros1.response_deform
    depends_on: []
    readiness:
      all:
        - type: ros1_topic
          name: /clock
          message_type: rosgraph_msgs/Clock
          max_age_seconds: 5
        - type: ros1_topic
          name: /tb_0/odom
          message_type: nav_msgs/Odometry
          max_age_seconds: 5
        - type: ros1_topic
          name: /response_group/status
          message_type: robosar_messages/ResponseGroupStatus
          max_age_seconds: 5
    start_timeout_seconds: 120
    grace_seconds: {sigint: 10, sigterm: 5, sigkill: 5}
stop_order: [response_demo]
data_profile: response_demo
artifact_profile: none
minimum_free_bytes: 2147483648
