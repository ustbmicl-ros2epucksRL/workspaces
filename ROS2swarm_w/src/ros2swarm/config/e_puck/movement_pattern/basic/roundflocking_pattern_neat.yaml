/**:
  ros__parameters:
    # ===== 环绕集群模式配置 (Round Flocking Pattern NEAT) =====
    # 使用旧 Webots 成功路径的 NEAT 控制器。

    # ===== NEAT 神经网络配置 =====
    # 当前文件内容与历史 flocking_genome_package_gen99.pkl 一致，只是文件名已改短。
    genome_file: 'flocking_genome_package_0.3.pkl'

    # ===== 速度限制 (基于 E-puck v2 安全参数) =====
    max_linear_velocity: 0.12
    max_angular_velocity: 1.0

    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1

    # ===== Webots 仿真目标配置 =====
    target_def_name: 'flocking_target'

    # ===== 激光雷达配置 =====
    n_lidar_rays: 12
    max_range: 0.20

    # ===== 观测归一化配置 =====
    world_scale: 1.75
