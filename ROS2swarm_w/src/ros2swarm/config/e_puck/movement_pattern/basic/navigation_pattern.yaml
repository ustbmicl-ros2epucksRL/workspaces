/**:
  ros__parameters:
    # ===== 导航模式配置 (Navigation Pattern) =====
    # 使用 NEAT 神经网络控制机器人导航到各自的目标点
    # 每个机器人有专属的目标点，目标点颜色不同且可进入
    
    # ===== NEAT 神经网络配置 =====
    # 基因包文件名（在checkpoints/navigation/目录下查找）
    # 可指定文件名如: 'navigation_genome_package.pkl'
    genome_file: 'navigation_genome_package.pkl'
    
    # ===== 速度限制 (基于 E-puck v2 安全参数) =====
    # E-puck v2 物理参数:
    #   - 电机最大角速度 ω_motor = 7.536 rad/s
    #   - 轮径 r = 0.02m（webots中是0.02m,实物是0.0205m）, 轮距 L = 0.052m（webots中是0.052m,实物是0.055m）
    #   5.8 rad/s 是 在 v = 0 时 才能达到的最大角速度（实物）
    #   0.154 m/s 是在 ω = 0 时 才能达到的最大线速度（实物）
    #   它们是"边界点"，不是"可叠加值"，若同时设置这两个值在webots运行时会报警告，超出电机最大角速度7.536 rad/s
    
    # 按webots的配置计算
    # 差速驱动约束 (当线速度和角速度同时作用时):
    #   轮角速度 = (v + L/2 × ω) / r <= 7.536 rad/s
    #   即: v + 0.026 × ω <= 0.15 m/s
    # NEAT网络会同时输出线速度和角速度，需保守设置:
    #   验证: 0.12 + 0.026 × 1.0 = 0.146 < 0.15 ✓
    max_linear_velocity: 0.12    # 最大线速度 (m/s)
    max_angular_velocity: 1.0    # 最大角速度 (rad/s)
    
    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1
    
    # ===== Webots 仿真对象名称 =====
    # 目标点DEF名称前缀，实际名称为 prefix_robotID（如 navigation_target_0）
    target_def_prefix: 'navigation_target'
    
    # ===== 任务完成判断配置 =====
    # 判断机器人是否到达目标的距离阈值（米）
    goal_threshold: 0.1  # 任务完成判断阈值 (m)
    
    # ===== 观测配置 =====
    # 网络输入维度: 位置(2) + 速度(2) + 目标相对位置(2) + 激光雷达(12) = 18
    # 这些参数需要匹配训练时的配置
    
    # 是否启用碰撞检测（添加激光雷达观测）
    # 训练时使用了碰撞检测，所以这里必须启用
    collisions: true
    
    # 激光雷达配置
    # 基于本地修改版 RpLidarA2 激光雷达（最小范围0.06m，最大范围12.0m，400束）
    n_lidar_rays: 12  # 激光雷达采样区间数（与训练时一致）
    max_range: 0.2   # 激光雷达使用的最大范围
    
    # ===== 观测归一化配置 =====
    # NEAT网络在VMAS环境训练时使用的坐标范围为 [-1, 1]
    # Webots仿真场景大小为 3.5x3.5，坐标范围为 [-1.75, 1.75]
    # world_scale用于将世界坐标归一化到网络期望的输入范围
    world_scale: 1.75  # 归一化因子: 实际坐标 / world_scale -> [-1, 1]
