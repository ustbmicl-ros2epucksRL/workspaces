/**:
  ros__parameters:
    # ===== 运输模式配置 (Transport Pattern) =====
    # 使用 VMAS 训练得到的 best_actor.pt 控制机器人协作搬运物体
    # 机器人需要协作将指定包裹推到目标区域
    
    # ===== 硬件保护层 =====
    # 运输任务需要接触包裹进行推动，跳过避障调整直接发布到 cmd_vel
    bypass_protection: true
    
    # ===== VMAS best_actor.pt 配置 =====
    actor_path: 'best_actor.pt'
    actor_device: 'cpu'
    
    # ===== 速度限制 (基于 E-puck v2 安全参数) =====
    # E-puck v2 物理参数:
    #   - 电机最大角速度 ω_motor = 7.536 rad/s
    #   - 轮径 r = 0.02m（webots中是0.02m,实物是0.0205m）, 轮距 L = 0.052m（webots中是0.052m,实物是0.055m）
    #   5.8 rad/s 是 在 v = 0 时 才能达到的最大角速度（实物）
    #   0.154 m/s 是在 ω = 0 时 才能达到的最大线速度（实物）
    #   它们是“边界点”，不是“可叠加值”，若同时设置这两个值在webots运行时会报警告，超出电机最大角速度7.536 rad/s
    
    #按webots的配置计算
    # 差速驱动约束 (当线速度和角速度同时作用时):
    #   轮角速度 = (v + L/2 × ω) / r <= 7.536 rad/s
    #   即: v + 0.026 × ω <= 0.15 m/s
    # actor 输出会被映射为线速度和角速度，需保守设置:
    #   验证: 0.12 + 0.026 × 1.0 = 0.146 < 0.15 ✓
    max_linear_velocity: 0.12    # 最大线速度 (m/s)
    max_angular_velocity: 1.0    # 最大角速度 (rad/s)
    
    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1
    
    # ===== Webots 仿真对象名称 =====
    box_def_name: 'transport_box'  # 待搬运包裹的 DEF 名称
    target_def_name: 'target_zone' # 目标区域的 DEF 名称
    
    # ===== 任务完成判断配置 =====
    # 判断包裹是否在目标上的距离阈值（米）
    # 计算方式：包裹中心到目标中心的距离 < goal_threshold 则认为完成任务
    goal_threshold: 0.22  # 任务完成判断阈值 (m)
    
    # ===== 观测归一化配置 =====
    # actor 在VMAS环境训练时使用的坐标范围为 [-1, 1]
    # Webots仿真场景大小为 3.5x3.5，坐标范围为 [-1.75, 1.75]
    # world_scale用于将世界坐标归一化到网络期望的输入范围
    world_scale: 1.75  # 归一化因子: 实际坐标 / world_scale -> [-1, 1]
    velocity_scale: 0.0       # <=0 表示使用 world_scale
    action_mapping: 'heading' # heading | projection | direct
    turn_gain: 2.0
    min_action_norm: 0.02
    allow_reverse: false
    allow_reverse_goal_distance: 0.6
    diagnostics_period: 2.0
