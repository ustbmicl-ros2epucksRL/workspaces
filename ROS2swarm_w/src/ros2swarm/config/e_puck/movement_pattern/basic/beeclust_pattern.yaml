/**:
  ros__parameters:
    # ===== 蜜蜂聚集模式配置 (BeeClust Pattern) =====
    # 模仿蜜蜂在温暖区域聚集的行为
    # 机器人在探测到同伴时停留，停留时间与当前位置的"温度"(光照强度)成正比
    # 
    # 传感器: RpLidarA2 激光雷达 (本地修改版)
    #   - 最小范围: 0.06m, 最大范围: 12.0m, 400束
    # 机器人: E-puck v2
    
    # ===== 检测范围 (单位: 米) =====
    # 基于本地修改版 RpLidarA2 激光雷达参数
    beeclust_max_range: 2.0   # 最大检测距离
    beeclust_min_range: 0.08  # 最小检测距离 (略大于激光雷达盲区0.06m)
    
    # ===== 光照强度范围 (模拟温度场) =====
    # 用于计算停留时间的光照传感器读数范围
    beeclust_max_luminance: 5000.0  # 最大光照值
    beeclust_min_luminance: 1.0     # 最小光照值
    
    # ===== 停留时间参数 =====
    # 停留时间计算: timer_period × (luminance / max_luminance) × scale_constant
    beeclust_max_timer_period: 4500.0  # 最大停留周期数
    beeclust_scale_constant: 100.0     # 时间缩放常数
    
    # ===== 势场计算参数 =====
    beeclust_front_attraction: 0.1  # 前向吸引力系数
    
    # ===== 物体识别参数 =====
    beeclust_object_reduction: 'MEAN'  # 'MEAN' 或 'NEAREST'
    beeclust_object_threshold: 0.1     # 物体区分阈值 (米)
    beeclust_object_min_width: 2       # 机器人最小宽度 (光束数)
    beeclust_object_max_width: 15      # 机器人最大宽度 (光束数)
    
    # ===== 速度限制 (基于 E-puck v2 安全参数) =====
    max_translational_velocity: 0.1   # 最大线速度 (m/s)
    max_rotational_velocity: 0.8      # 最大角速度 (rad/s)
