/**:
  ros__parameters:
    # ===== 分散模式配置 (Dispersion Pattern) =====
    # 使机器人远离探测到的其他机器人/物体，实现空间均匀分布
    # 使用 potential_field 函数，基于势场法计算排斥方向
    # 
    # 传感器: RpLidarA2 激光雷达 (本地修改版)
    #   - 最小范围: 0.06m, 最大范围: 12.0m, 400束
    # 机器人: E-puck v2
    #   - 电机最大角速度: 7.536 rad/s
    #   - 轮径: 0.02m, 轮距: 0.052m
    
    # ===== 检测范围 (单位: 米) =====
    # 基于本地修改版 RpLidarA2 激光雷达参数
    dispersion_max_range: 1.5   # 分散行为的最大检测距离 (在激光雷达范围内)
    dispersion_min_range: 0.08  # 分散行为的最小检测距离 (略大于激光雷达盲区0.06m)
    
    # ===== 前向吸引力系数 =====
    # 用于势场计算中调整前进方向的偏好
    # - 正值: 在分散的同时倾向于保持前进
    # - 负值: 倾向于后退
    # - 值越大，前进意愿越强
    dispersion_front_attraction: 1.0
    
    # ===== 物体检测阈值 (单位: 光束数量) =====
    # 当有效范围内的光束数量 > 此阈值时，认为检测到物体需要分散
    # RpLidarA2 有 400 束，设置适当阈值过滤噪声
    dispersion_threshold: 3
    
    # ===== 独处时的行为 (当范围内没有检测到其他机器人时) =====
    dispersion_linear_if_alone: 0.0  # 独处时的线速度 (m/s)，0 表示原地静止
    dispersion_angular_if_alone: 0.2 # 独处时的角速度 (rad/s)，正值表示原地左转搜索
    
    # ===== 速度限制 (基于 E-puck v2 安全参数) =====
    max_translational_velocity: 0.12  # 最大线速度 (m/s)
    max_rotational_velocity: 1.0      # 最大角速度 (rad/s)
