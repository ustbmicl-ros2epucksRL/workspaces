/**:
  ros__parameters:
    # ===== 直线驱动模式配置 (Drive Pattern) =====
    # 最简单的运动模式，机器人以恒定速度运动
    # 主要用于测试和调试
    # 
    # 机器人: E-puck v2
    #   - 电机最大角速度: 7.536 rad/s
    #   - 轮径: 0.02m, 轮距: 0.052m
    #   - 最大安全轮速: ~0.15 m/s
    
    # ===== 控制周期 (单位: 秒) =====
    # 发布速度命令的时间间隔
    drive_timer_period: 0.25
    
    # ===== 运动速度 (基于 E-puck v2 安全参数) =====
    drive_linear: 0.1   # 线速度 (m/s)，正值前进，负值后退
    drive_angular: 0.0  # 角速度 (rad/s)，正值左转，负值右转，0 表示直行
