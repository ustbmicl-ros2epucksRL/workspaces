/**:
  ros__parameters:
    # ===== 环绕集群模式配置 (Round Flocking Pattern) =====
    # 使用 VMAS 训练得到的 best_actor.pt 控制机器人围绕目标点进行集群运动
    # 机器人在目标周围形成环绕编队
    # 
    # 传感器: RpLidarA2 激光雷达 (本地修改版)
    #   - 最小范围: 0.06m, 最大范围: 12.0m, 400束
    # 机器人: E-puck v2
    #   - 电机最大角速度: 7.536 rad/s
    #   - 轮径: 0.02m, 轮距: 0.052m
    
    # ===== VMAS best_actor.pt 配置 =====
    actor_path: 'best_actor.pt'
    actor_device: 'cpu'
    
    # ===== 速度限制 (基于 E-puck v2 安全参数) =====
    # E-puck v2 物理参数:
    #   - 电机最大角速度 ω_motor = 7.536 rad/s
    #   - 轮径 r = 0.02m, 轮距 L = 0.052m
    #   - 理论最大线速度 ≈ 0.15 m/s
    # 差速驱动约束: v + 0.026 × ω <= 0.15 m/s
    # 验证: 0.12 + 0.026 × 1.0 = 0.146 < 0.15 ✓
    max_linear_velocity: 0.12  # 最大线速度 (m/s)
    max_angular_velocity: 1.0  # 最大角速度 (rad/s)
    
    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1
    
    # ===== Webots 仿真目标配置 =====
    target_def_name: 'flocking_target'  # 环绕目标的 DEF 名称 (圆柱体)
    target_radius: 0.6                  # 训练侧期望环绕半径
    
    # ===== 激光雷达配置 =====
    # 基于本地修改版 RpLidarA2 激光雷达 (400 束)
    n_lidar_rays: 12   # 采样区间数 (将360°分为12个区间，每个30°)
    max_range: 0.20    # 使用的最大探测范围 (m)，略大于盲区0.06m
    
    # ===== 观测归一化配置 =====
    # best_actor.pt 复用旧 Webots 成功路径：
    # Webots仿真场景大小为 3.5x3.5，坐标范围为 [-1.75, 1.75]
    # Webots仿真场景大小为 2.0x2.0，坐标范围为 [-1.0, 1.0]
    world_scale: 1.0
    velocity_scale: 1.0
    target_centric_position: false

    # ===== 独立 recurrent 状态下的环半径外环 =====
    # best_actor.pt 在训练侧共享 recurrent 状态时能稳定贴近 0.6m；
    # Webots 旧成功路径要求每机器人独立状态，因此保留 actor 输出并叠加半径/切向稳定项。
    ring_stabilization_enabled: true
    actor_action_weight: 0.25
    ring_radial_gain: 6.0
    ring_tangential_gain: 1.0
