/**:
  ros__parameters:
    # ===== 环绕集群模式配置 (Round Flocking Pattern) =====
    # 使用 NEAT 神经网络控制机器人围绕目标点进行集群运动
    # 机器人在目标周围形成环绕编队
    # 
    # 传感器: RpLidarA2 激光雷达 (本地修改版)
    #   - 最小范围: 0.06m, 最大范围: 12.0m, 400束
    # 机器人: E-puck v2
    #   - 电机最大角速度: 7.536 rad/s
    #   - 轮径: 0.02m, 轮距: 0.052m
    
    # ===== NEAT 神经网络配置 =====
    # 基因包文件名（在checkpoints/roundflocking/目录下查找）
    # 可指定文件名如: 'flocking_genome_package_0.3.pkl' 或 'flocking_genome_package_0.6.pkl'
    # 留空则使用默认: 'flocking_genome_package_0.3.pkl'  #####0.6版本仍未完整适配（这个包含tanh的激活函数）
    genome_file: 'flocking_genome_package_0.3.pkl'
    
    # ===== 速度限制 (基于 E-puck v2 安全参数) =====
    # E-puck v2 物理参数:
    #   - 电机最大角速度 ω_motor = 7.536 rad/s
    #   - 轮径 r = 0.02m, 轮距 L = 0.052m
    #   - 理论最大线速度 ≈ 0.15 m/s
    # 差速驱动约束: v + 0.026 × ω <= 0.15 m/s
    # 验证: 0.12 + 0.026 × 1.0 = 0.146 < 0.15 ✓
    max_linear_velocity: 0.12  # 最大线速度 (m/s)
    max_angular_velocity: 1.0  # 最大角速度 (rad/s)
    
    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1
    
    # ===== Webots 仿真目标配置 =====
    target_def_name: 'flocking_target'  # 环绕目标的 DEF 名称 (圆柱体)
    
    # ===== 激光雷达配置 =====
    # 基于本地修改版 RpLidarA2 激光雷达 (400 束)
    n_lidar_rays: 12   # 采样区间数 (将360°分为12个区间，每个30°)
    max_range: 0.20    # 使用的最大探测范围 (m)，略大于盲区0.06m
    
    # ===== 观测归一化配置 =====
    # NEAT网络在VMAS环境训练时使用的坐标范围为 [-1, 1]
    # Webots仿真场景大小为 3.5x3.5，坐标范围为 [-1.75, 1.75]
    # world_scale用于将世界坐标归一化到网络期望的输入范围
    world_scale: 1.75  # 归一化因子: 实际坐标 / world_scale -> [-1, 1]
