/**:
  ros__parameters:
    # ===== 运输模式配置 (Transport Pattern NEAT) =====
    # 使用旧 Webots 成功路径的 NEAT 控制器。

    # ===== 硬件保护层 =====
    bypass_protection: true

    # ===== NEAT 神经网络配置 =====
    # 当前文件内容与历史 transport_genome_package_gen264.pkl 一致，只是文件名已改短。
    genome_file: 'transport_genome_package.pkl'

    # ===== 速度限制 (基于 E-puck v2 安全参数) =====
    max_linear_velocity: 0.12
    max_angular_velocity: 1.0

    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1

    # ===== Webots 仿真对象名称 =====
    box_def_name: 'transport_box'
    target_def_name: 'target_zone'

    # ===== 任务完成判断配置 =====
    goal_threshold: 0.15

    # ===== 观测归一化配置 =====
    # Webots仿真场景大小为 3.5x3.5，坐标范围为 [-1.75, 1.75]
    # Webots仿真场景大小为 2.0x2.0，坐标范围为 [-1.0, 1.0]
    world_scale: 1.0
