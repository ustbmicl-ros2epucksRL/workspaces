/**:
  ros__parameters:
    # ===== E-puck v2 + RpLidarA2 激光雷达配置 =====
    # 本配置用于 LidarLayer 节点，订阅 /scan 话题 (LaserScan)
    # 并发布到 /range_data 话题 (RangeData)
    # 
    # 传感器说明:
    # - 激光雷达: RpLidarA2 (本地修改版)
    #   - 发布话题: /scan (LaserScan)
    #   - 角度范围: 360° (0 ~ 2π rad)
    #   - 分辨率: 400 束 (每束 0.9°)
    #   - 最小范围: 0.06m (本地修改，原 0.2m)
    #   - 最大范围: 12.0m
    #   - 扫描频率: 12Hz
    #   - 噪声: 0.000833
    #   - 距离分辨率: 0.01m
    #
    # - 红外传感器 ps0-ps7 (可选，由 IRLayer 使用)
    #   - 发布话题: /ps0 ~ /ps7 (Range)
    #   - 最大范围: 0.04m (epuck_node.py 中定义)
    
    # ===== 激光雷达参数 (用于 LidarLayer) =====
    # 传感器距离范围 (单位: 米)
    # 根据本地修改版 RpLidarA2.proto:
    #   - minRange: 0.06m (减小盲区)
    #   - maxRange: 12.0m
    max_range: 12.0  # 激光雷达最大有效测量距离
    min_range: 0.06  # 激光雷达最小有效测量距离 (本地修改版)
    
    # 物体检测参数
    # 'MEAN': 多个光束探测到的距离取平均值
    # 'NEAREST': 选择最近的物体距离
    object_reduction: 'MEAN'
    
    # 物体区分阈值 (单位: 米)
    # 当相邻光束检测距离差超过此值时，视为不同物体
    object_threshold: 0.2
    
    # 物体宽度范围 (单位: 激光光束数量)
    # 定义被识别为"机器人"的物体应占用的光束数量范围
    # E-puck 机器人直径约 0.074m，在不同距离对应不同光束数:
    # RpLidarA2 有 400 束，角度分辨率 0.9°/束
    #   - 0.5m 处约占 8.5° ≈ 9 束
    #   - 1.0m 处约占 4.2° ≈ 5 束
    #   - 2.0m 处约占 2.1° ≈ 2 束
    object_min_width: 1   # 最小宽度
    object_max_width: 18  # 最大宽度 (考虑近距离情况，400束时略增加)
    
    # ===== 红外传感器参数 (用于 IRLayer，可选) =====
    # 如果同时使用红外传感器，取消以下注释
    # 
    # 传感器角度配置 (单位: 弧度)
    # E-puck 有 8 个红外传感器(ps0-ps7)
    # 角度定义: 机器人 x 轴(前进方向)与传感器探测方向的夹角，逆时针为正
    # 注意: 这里的角度定义与 epuck_node.py 中 DISTANCE_SENSOR_ANGLE 一致
    # ps0: -15° = -0.2618 rad, ps1: -45° = -0.7854 rad
    # ps2: -90° = -1.5708 rad, ps3: -150° = -2.6180 rad
    # ps4: +150° = 2.6180 rad, ps5: +90° = 1.5708 rad
    # ps6: +45° = 0.7854 rad, ps7: +15° = 0.2618 rad
    # angles: [-0.2617994, -0.78539816, -1.57079633, -2.61799388, 2.61799388, 1.57079633, 0.78539816, 0.2617994]
    # range_topics: ["ps0", "ps1", "ps2", "ps3", "ps4", "ps5", "ps6", "ps7"]
