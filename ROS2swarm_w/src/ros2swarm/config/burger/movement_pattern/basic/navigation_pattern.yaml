/**:
  ros__parameters:
    # ===== 导航模式配置 (Navigation Pattern) =====
    # 使用 VMAS 训练得到的 best_actor.pt 控制机器人导航到各自的目标点
    # 每个机器人有专属的目标点，目标点颜色不同且可进入
    
    # ===== VMAS best_actor.pt 配置 =====
    actor_path: 'best_actor.pt'
    actor_device: 'cpu'
    
    # ===== 速度限制 (基于 TurtleBot3 Burger 参数) =====
    # TurtleBot3 Burger 物理参数:
    #   - 最大线速度: 0.22 m/s
    #   - 最大角速度: 2.84 rad/s
    # 保守设置以确保稳定运行
    max_linear_velocity: 0.15    # 最大线速度 (m/s)
    max_angular_velocity: 1.5    # 最大角速度 (rad/s)
    
    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1
    
    # ===== Webots 仿真对象名称 =====
    target_def_prefix: 'navigation_target'
    
    # ===== 任务完成判断配置 =====
    goal_threshold: 0.1  # 任务完成判断阈值 (m)
    
    # ===== 观测配置 =====
    # 网络输入维度: 位置(2) + 速度(2) + 目标相对位置(2) + 激光雷达(12) = 18
    collisions: true
    n_lidar_rays: 12
    max_range: 0.35
    
    # ===== 观测归一化配置 =====
    world_scale: 1.75
    velocity_scale: 0.0
    action_mapping: 'heading'
    turn_gain: 2.0
    min_action_norm: 0.02
    allow_reverse: true
    diagnostics_period: 2.0
