/**:
  ros__parameters:
    # ===== 运输模式配置 (Transport Pattern NEAT) =====
    bypass_protection: true
    genome_file: 'transport_genome_package.pkl'

    # ===== 速度限制 (基于 TurtleBot3 Burger 参数) =====
    max_linear_velocity: 0.15
    max_angular_velocity: 0.8

    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1

    # ===== Webots 仿真对象名称 =====
    box_def_name: 'transport_box'
    target_def_name: 'target_zone'

    # ===== 任务完成判断配置 =====
    goal_threshold: 0.15

    # ===== 观测归一化配置 =====
    world_scale: 1.75
