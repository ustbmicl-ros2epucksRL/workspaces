/**:
  ros__parameters:
    # ===== 环绕集群模式配置 (Round Flocking Pattern NEAT) =====
    genome_file: 'flocking_genome_package_0.3.pkl'

    # ===== 速度限制 (基于 TurtleBot3 Burger 参数) =====
    max_linear_velocity: 0.15
    max_angular_velocity: 0.8

    # ===== 控制周期 (单位: 秒) =====
    timer_period: 0.1

    # ===== Webots 仿真目标配置 =====
    target_def_name: 'flocking_target'

    # ===== 激光雷达配置 =====
    n_lidar_rays: 12
    max_range: 3.5

    # ===== 观测归一化配置 =====
    world_scale: 1.75
