/**:
  ros__parameters:
    # Burger所有非transport任务共用同一套平台安全边界。
    # transport直接发布/cmd_vel，以允许机器人接触被运输物体。
    hardware_protection_layer_max_range: 0.350
    hardware_protection_layer_min_range: 0.12
    hardware_protection_layer_front_attraction: 2.0
    hardware_protection_layer_threshold: 5
    max_translational_velocity: 0.15
    max_rotational_velocity: 0.8

    # diff_drive_controller使用0.16m轮距和1.112修正系数；轮电机上限6.67rad/s。
    # HPL按同一比例缩放(v,w)，保持轨迹曲率并避免单侧轮速饱和。
    wheel_separation: 0.17792
    max_wheel_linear_velocity: 0.2200
