# 作用：响应组多航点 demo 的任务源和速度仲裁配置。
# 使用范围：response_deform_demo.launch / run_response_deform_demo.sh。
# 不用于 Tepper 大系统，也不用于 roundflocking/transport 独立控制器 demo。
# 导航算法参数统一维护在 formation_navigation.yaml，本文件不再复制导航策略。
# 五个阶段目标点在 response_goal_sequence.yaml 中配置。

# 响应组四个机器人的命名空间；用于订阅 /tb_i/odom、发布 /tb_i/cmd_vel 并生成编队槽位。
robot_names: [tb_0, tb_1, tb_2, tb_3]

# 状态、目标和可视化标记使用的全局坐标系；第 0 阶段 demo 中 map 与 Gazebo world 静态对齐。
frame_id: map

# response_cmd_mux_node 的定时更新频率，单位为赫兹。
rate: 10.0

# 速度指令新鲜度超时时间，超过该时间未收到新指令则该指令源置零，单位为秒。
command_timeout: 0.6

# response_cmd_mux_node 的初始行为模式。运动许可默认关闭，模式也必须从 STOP 起步。
default_mode: STOP
