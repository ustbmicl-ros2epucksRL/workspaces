# 作用：第一/第二阶段 Tepper 大场景响应组的公共基础配置。
# 使用范围：tepper_response_demo.launch，以及 roundflocking/transport 独立控制器 demo 的公共参数。
# 独立控制器 demo 会在本文件之后再加载各自的 *_controller_demo.yaml 覆盖 demo 专属参数。
# 不影响第 0 阶段 response_deform_demo.launch。

# 响应组四个 TurtleBot 的命名空间。
robot_names: [tb_0, tb_1, tb_2, tb_3]

# 响应组在 Tepper 大场景中的默认出生位姿由 tepper_response_demo.launch 的 tb_i_x/y/yaw 参数配置。

# 全局坐标系。Tepper Gazebo 与响应组 world 通过 map->world 静态变换对齐。
frame_id: map

# 响应组初始中心 x 坐标，单位为米；用于首次任务尚无响应组状态时计算 staging pose 和返航点。
initial_response_center_x: 4.00

# 响应组初始中心 y 坐标，单位为米；与 initial_response_center_x 一起定义 home pose。
initial_response_center_y: 16.40

# 响应组只在 GUI 的响应组 HOME 命令后返航；任务链完成后原地等待。
auto_return_home: false

# 自动返航任务使用的保留 task_id；负数避免与真实应急对象 task_id 冲突。
return_home_task_id: -1000

# 是否等待 /response_group/start 信号后才开始接任务派发。
wait_for_start: true

# 大系统首次发现任务后短暂聚合首批事件，避免先发现的低优先级目标抢跑。
initial_dispatch_delay_seconds: 3.0

# Tepper 闭环验证要求当前任务到达并执行控制器后再进入下一项；
# 保留代码能力，但大系统默认不在 EN_ROUTE 中途换目标。
enable_priority_preemption: false

# 距当前 active staging pose 小于该距离后不再抢占，避免临门一脚反复换目标。
priority_preemption_min_remaining_distance: 3.0

# 第一阶段可设为 true：到达任务点后执行 6 秒自转占位；第二阶段设为 false 使用 checkpoint 控制器。
use_spin_placeholder: false

# 捕获运行时返航中心所需的最小响应组机器人比例。
home_capture_min_robot_fraction: 1.0

# transport 编队中心落在箱体后方的距离，沿推送方向反向计算，单位为米。
transport_rear_distance: 1.0

# 普通任务控制器最长执行时长，单位为秒；roundflocking 会优先使用该值。
default_hold_seconds: 20.0

# 编队导航与到达判据统一由 formation_navigation.yaml 管理。
# response_cmd_mux_node 的定时更新频率，单位为赫兹。
rate: 10.0

# response_task_controller_node 的控制器推理/发布频率，单位为赫兹。
task_controller_rate: 10.0

# response_global_info_node 发布 ROS2swarm 兼容 /global_info JSON 的频率，单位为赫兹。
global_info_rate: 10.0

# 速度指令新鲜度超时时间，超过该时间未收到新指令则该指令源置零，单位为秒。
command_timeout: 0.6

# 速度融合节点初始行为模式。任务管理器启动前会发布 STOP。
default_mode: STOP

# Tepper 生产链只使用物理同步槽位：全队先 ALIGN，再统一 PUSH。
# checkpoint/heuristic 仅保留在独立控制器对比 demo，不参与大系统运行。
transport_controller_type: synchronized_slots

# Tepper 已验收主链默认使用可解释、可自适应半径的 heuristic 控制器；
# checkpoint 仅保留给独立对照实验。
roundflocking_controller_type: heuristic

# checkpoint / heuristic 任务控制器的最大线速度，单位为米每秒。
# 对齐 ROS2swarm_w burger 任务控制器的保守差速适配值。
max_linear_velocity: 0.15

# checkpoint / heuristic 任务控制器的最大角速度，单位为弧度每秒。
max_angular_velocity: 0.8

# Gazebo TB3 transport 同步物理槽位参数。
# 前排槽位到箱体中心的距离，需接近“箱体半宽 + TB3 前向碰撞半径”以保证接触。
transport_tb3_contact_distance: 0.31

# 后排相对前排的请求间距；PUSH 阶段由适配器按纵向物理长度收敛成接触链，
# ALIGN 阶段自动增加 robot_gap，避免用同一套几何同时表达接触和无碰撞。
transport_tb3_row_spacing: 0.20

# 显式指定 slot_columns 时使用的横向槽位间距；默认自动布局不会使用该值。
transport_tb3_lateral_spacing: 0.10

# 自动布局的横向最大偏移；0.15m 让前排两个 TB3 分别落在箱体后表面两侧。
transport_tb3_max_lateral_offset: 0.15

# transport 箱体平面宽度，单位为米；用于自动计算前排横向槽位。
transport_tb3_box_width: 0.50
transport_tb3_box_length: 0.50

# 横向保守规划宽度，与编队导航 robot_radius=0.11 一致。
transport_tb3_robot_width: 0.22

# Burger URDF 碰撞盒纵向长度，用于箱面和前后车的物理接触链。
transport_tb3_robot_length: 0.13

# 自动槽位布局中相邻机器人之间预留的横向间隙，单位为米。
transport_tb3_robot_gap: 0.04

# 自动槽位布局中箱体边缘预留的安全余量，单位为米。
transport_tb3_box_edge_margin: 0.01

# 槽位误差到 VMAS 全局动作的比例增益。
transport_tb3_slot_gain: 2.5

# 槽位到位后沿推箱方向叠加的动作强度。
transport_tb3_push_speed: 0.55

# ALIGN 阶段每台车允许的推送朝向误差，单位为弧度。
transport_tb3_alignment_yaw_tolerance: 0.20

# 全队连续满足对齐条件的保持时间，避免瞬时穿越槽位触发推送。
transport_tb3_alignment_hold_seconds: 0.50

# 在槽位内原地对齐推送朝向的比例增益。
transport_tb3_heading_gain: 2.0

# 锁定推送坐标系后，箱体偏离起点到目标的直线时施加横向纠偏。
transport_tb3_box_lateral_gain: 1.2

# 箱体横向纠偏动作上限，避免接近目标时因横向误差产生急转。
transport_tb3_max_box_lateral_action: 0.35

# roundflocking heuristic 的期望环绕半径，单位为米。
roundflocking_heuristic_circle_radius: 0.60

# 局部外侧/切向通道被占用时允许收缩到的安全环绕半径；目标内侧障碍不会触发缩圈。
roundflocking_heuristic_minimum_circle_radius: 0.38

# roundflocking heuristic 沿切向前看的偏移量，单位为米；决定绕行推进方向和切向速度倾向。
roundflocking_heuristic_normal_offset: 0.10

# roundflocking heuristic 认为 LiDAR 中存在近物体的距离阈值，单位为米。
roundflocking_heuristic_object_visible_range: 0.45

# roundflocking heuristic 发现近物体时从该方向额外避开的距离，单位为米。
roundflocking_heuristic_object_avoid_distance: 0.18

# roundflocking heuristic 从期望点误差到动作向量的比例增益。
roundflocking_heuristic_gain: 10.0

# roundflocking heuristic 动作向量每个分量的饱和值。
roundflocking_heuristic_u_range: 1.0

# roundflocking heuristic 动作转成差速指令前的整体速度缩放。
roundflocking_heuristic_speed: 1.0

# roundflocking 最长执行窗，单位为秒；任务消息只能延长、不能缩短该时限。
roundflocking_duration: 90.0

# 是否启用 roundflocking 完成监测；启用后需要观察到机器人绕目标产生实际角度推进。
roundflocking_completion_enabled: true

# roundflocking 完成监测的最短观察时间，单位为秒；避免刚启动的短暂抖动被判为完成。
roundflocking_completion_min_duration: 4.0

# 单台机器人被认为完成环绕所需的最小累计角度进展：4*pi，即两整圈。
roundflocking_completion_min_angle_progress: 12.566370614359172

# 参与完成判定的机器人允许距离目标的最大半径，单位为米；超出则该段角度不计入。
roundflocking_completion_max_radius: 1.2

# roundflocking 判定任务完成所需的机器人比例；生产配置要求全员达标。
roundflocking_completion_required_robot_fraction: 1.0

# roundflocking 判定任务完成所需的最小机器人数；响应组固定四台，要求全员。
roundflocking_completion_required_robot_count: 4

# transport 最长执行时间，单位为秒。
transport_max_duration: 180.0

# transport 箱体中心进入目标中心 0.15m 内才判定 transport 完成；
# 同时保持 checkpoint 观测中的 on_goal 标志与训练配置一致。
goal_threshold: 0.15

# transport 完成判定需要连续保持的时间，单位为秒。
transport_goal_hold_seconds: 1.0

# transport 超时时是否按完成处理；大系统必须为 false，只有箱体真的进目标区才 DONE。
complete_transport_on_timeout: false

# 第一阶段自转占位控制器持续时间，单位为秒。
spin_duration: 6.0

# 第一阶段自转占位控制器角速度，单位为弧度每秒。
spin_angular_velocity: 0.6

# roundflocking 激光采样扇区数量，对齐 ROS2swarm。
n_lidar_rays: 12

# checkpoint 观测中使用的最大激光范围，单位为米。
max_range: 3.5

# transport/Tepper 大场景坐标归一化尺度；用于 transport checkpoint 观测归一化与 heuristic 坐标还原。
world_scale: 20.0

# roundflocking checkpoint 的专用坐标尺度；对齐 ROS2swarm_w 的 Webots/VMAS 归一化口径。
roundflocking_world_scale: 1.75
