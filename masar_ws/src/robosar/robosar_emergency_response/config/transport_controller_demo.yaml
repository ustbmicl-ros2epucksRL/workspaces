# transport 独立控制器 demo 专用参数。
# launch 会先加载 tepper_response_group.yaml 作为公共基础参数，再加载本文件覆盖 demo 专属项。

# response_task_fixture_node 发布的任务类型；transport/box 表示生成 BOX 推箱任务。
task_kind: transport

# demo 中箱体初始中心 x 坐标，单位为米；也作为 /global_info 中 transport_box 的初始回退位置。
box_x: -0.5

# demo 中箱体初始中心 y 坐标，单位为米。
box_y: 0.0

# demo 中箱体初始偏航角，单位为弧度。
box_yaw: 0.0

# 目标区域中心 x 坐标，单位为米；箱体中心进入 goal_threshold 内判定完成。
goal_x: 1.25

# 目标区域中心 y 坐标，单位为米。
goal_y: 0.0

# 目标区域朝向，单位为弧度；transport 完成判定只使用目标中心位置。
goal_yaw: 0.0

# transport demo 的坐标归一化尺度；1.75 对齐 ROS2swarm_w 小场景 checkpoint 输入范围。
world_scale: 1.75

# transport 控制器类型；checkpoint 使用 NEAT 基因包，heuristic 使用解析式 VMAS dribble 策略。
transport_controller_type: checkpoint

# transport 独立 demo 的最长执行时间，单位为秒；给推箱接触和收敛留足时间。
transport_max_duration: 600.0

# transport 超时时是否按完成处理；false 表示必须真的进入目标阈值才 DONE。
complete_transport_on_timeout: false

# response_cmd_mux_node 的初始行为模式；TASK_CONTROL 表示直接采用 /tb_i/task_cmd_vel。
default_mode: TASK_CONTROL
