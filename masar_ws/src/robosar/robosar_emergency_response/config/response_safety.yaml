# Response command mux hard-safety boundary. Normal path following, deformation
# and local steering belong to formation_navigation_node; the mux only selects
# the authoritative source and prevents unsafe translation.

# Stop translation toward an unexpected LiDAR return inside this distance.
hard_stop_distance: 0.20

# Half-width of the finite swept corridor in the commanded translation direction.
# This matches the TB3 planar half-width and ignores harmless side returns.
hard_stop_half_width: 0.11

# Ignore returns within the observed Burger sensor/self-reflection footprint.
# External returns from 0.18 m through hard_stop_distance remain protected.
hard_stop_self_filter_radius: 0.18

# A missing or stale scan fails closed for non-zero commands.
scan_timeout: 0.30

# Final velocity bounds at the unique cmd_vel owner.
max_translational_velocity: 0.22
max_rotational_velocity: 1.20

# Center-distance invariant enforced in navigation and task-control modes.
# Match the formation layer's physical body diameter (2*0.11) plus its single
# shared 0.04 m safety gap, so command discretization cannot consume the whole
# collision margin before the next mux cycle.
teammate_min_center_distance: 0.26

# Exploration robots remain protected by the normal distance in every mode.
external_robot_names: [agent_0, agent_1, agent_2, agent_3, agent_4]

# 任务控制器切换后仍共享跨组优先权约束。该时间窗把实时距离裕量换算为
# 允许接近速度，使探索车有时间执行让行；不是某个 Tepper 坐标点的恢复规则。
external_priority_reaction_horizon: 1.0

# During BOX/PUSH only response-response contact may close to the URDF body
# length. The mux derives its deep-overlap guard from robot_length/robot_gap in
# the shared response-group geometry; there is no independent contact tuning.

# Physical transport-box geometry for the sole permitted contact exclusion.
# Only rays matching the live /global_info box bearing and range are excluded.
# Circumscribed radius of the 0.50 m square box; using the half-side would
# reject valid LiDAR returns from its corners during contact.
transport_box_radius: 0.36
transport_box_range_padding: 0.03
