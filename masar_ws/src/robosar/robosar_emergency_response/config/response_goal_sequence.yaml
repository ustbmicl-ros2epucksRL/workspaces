# 作用：第 0 阶段 DEFORM 编队导航 demo 的顺序目标列表。
# 使用范围：response_goal_sequence_node.py；该节点按 goals 顺序发布 /response_group/formation_goal
# 和一个 EN_ROUTE 状态的 /response_group/active_task，等待 response_group_coordinator_node 报 DONE 后进入下一项。

# 默认坐标系；每个 goal 条目未单独设置 frame_id 时使用该值。
frame_id: map

# 顺序导航目标数组；列表顺序就是 demo 中响应组依次前往的目标顺序。
goals:
  # 第 0 个目标的任务/目标 ID，会写入 EmergencyTask.task_id 并用于完成回调匹配。
  - id: 0
    # 目标点在 frame_id 坐标系下的 x 坐标，单位为米。
    x: 4.2
    # 目标点在 frame_id 坐标系下的 y 坐标，单位为米。
    y: 4.6
    # 目标编队朝向，单位为弧度；0 表示朝向 +x 方向。
    yaw: 0.0
  # 第 1 个目标的任务/目标 ID。
  - id: 1
    # 第 1 个目标的 x 坐标，单位为米。
    x: 0.0
    # 第 1 个目标的 y 坐标，单位为米。
    y: 4.6
    # 第 1 个目标的目标朝向，单位为弧度。
    yaw: 0.0
  # 第 2 个目标的任务/目标 ID。
  - id: 2
    # 第 2 个目标的 x 坐标，单位为米。
    x: 0.0
    # 第 2 个目标的 y 坐标，单位为米。
    y: -4.6
    # 第 2 个目标的目标朝向，单位为弧度。
    yaw: 0.0
  # 第 3 个目标的任务/目标 ID。
  - id: 3
    # 第 3 个目标的 x 坐标，单位为米。
    x: -4.2
    # 第 3 个目标的 y 坐标，单位为米。
    y: -4.6
    # 第 3 个目标的目标朝向，单位为弧度。
    yaw: 0.0
  # 第 4 个目标的任务/目标 ID。
  - id: 4
    # 第 4 个目标的 x 坐标，单位为米。
    x: -4.2
    # 第 4 个目标的 y 坐标，单位为米。
    y: 4.6
    # 第 4 个目标的目标朝向，单位为弧度。
    yaw: 0.0
