# Plugin params
solver_plugin: solver_plugins::CeresSolver
ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
ceres_preconditioner: SCHUR_JACOBI
ceres_trust_strategy: LEVENBERG_MARQUARDT
ceres_dogleg_type: TRADITIONAL_DOGLEG
ceres_loss_function: None

# ROS 话题与坐标系参数
map_name: /slam_toolbox/map                               # OccupancyGrid 发布前缀；同时会发布 <map_name>_metadata
map_frame: map                                            # 地图坐标系名称；也是 map->odom 变换的父坐标系
odom_frames: ["agent_0/odom", "agent_1/odom", "agent_2/odom", "agent_3/odom", "agent_4/odom"]  # 各机器人里程计坐标系列表；需与下方各列表按索引一一对应
base_frames: ["agent_0/base_laser_link", "agent_1/base_laser_link", "agent_2/base_laser_link", "agent_3/base_laser_link", "agent_4/base_laser_link"]  # 必须与 LaserScan.header.frame_id 一致，否则同步建图会持续报 not found
#laser_topics: ["/agent_0/base_scan", "/agent_1/base_scan", "/agent_2/base_scan", "/agent_3/base_scan", "/agent_4/base_scan"]  # 旧版激光话题命名示例
laser_topics: ["/robosar_agent_bringup_node/agent_0/feedback/scan", "/robosar_agent_bringup_node/agent_1/feedback/scan", "/robosar_agent_bringup_node/agent_2/feedback/scan", "/robosar_agent_bringup_node/agent_3/feedback/scan", "/robosar_agent_bringup_node/agent_4/feedback/scan"]  # 各机器人 LaserScan 输入话题列表
apriltag_topics: ["/robosar_agent_bringup_node/agent_0/feedback/apriltag", "/robosar_agent_bringup_node/agent_1/feedback/apriltag", "/robosar_agent_bringup_node/agent_2/feedback/apriltag", "/robosar_agent_bringup_node/agent_3/feedback/apriltag", "/robosar_agent_bringup_node/agent_4/feedback/apriltag"]  # 各机器人 AprilTagDetectionArray 输入话题列表
mode: mapping 

# if you'd like to immediately start continuing a map at a given pose
#map_file_name: test_steve
# map_start_pose: [0.0, 0.0, 0.0]
#map_start_at_dock: true

debug_logging: false
throttle_scans: 1
transform_publish_period: 0.02 #if 0 never publishes odometry
map_update_interval: 5.0
resolution: 0.05
max_laser_range: 20.0 #for rastering images
minimum_time_interval: 0.5
transform_timeout: 0.2
tf_buffer_duration: 30.
stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
enable_interactive_mode: true

# General Parameters
use_scan_matching: true
use_scan_barycenter: true
minimum_travel_distance: 0.5
minimum_travel_heading: 0.5
scan_buffer_size: 10
scan_buffer_maximum_scan_distance: 10
link_match_minimum_response_fine: 0.5  
link_scan_maximum_distance: 1.5
do_loop_closing: true 
loop_match_minimum_chain_size: 10           
loop_match_maximum_variance_coarse: 3.0  
loop_match_minimum_response_coarse: 0.35    
loop_match_minimum_response_fine: 0.45

# Correlation Parameters - Correlation Parameters
correlation_search_space_dimension: 0.5
correlation_search_space_resolution: 0.01
correlation_search_space_smear_deviation: 0.1 

# Correlation Parameters - Loop Closure Parameters
loop_search_space_dimension: 1.0
loop_search_space_resolution: 0.01
loop_search_space_smear_deviation: 0.03
loop_search_maximum_distance: 5.0

# Scan Matcher Parameters
distance_variance_penalty: 1.0
angle_variance_penalty: 1.0

fine_search_angle_offset: 0.00349     
coarse_search_angle_offset: 0.349   
coarse_angle_resolution: 0.0349        
minimum_angle_penalty: 0.9
minimum_distance_penalty: 0.5
use_response_expansion: true